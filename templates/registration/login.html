{% extends "base.html" %}
{% block title %}Anmelden{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-sm-9 col-md-6 col-lg-4">
    <div class="text-center mb-4">
      <i class="bi bi-box-seam display-5 text-primary"></i>
      <h1 class="h4 mt-2">{{ site_name }}</h1>
    </div>
    <div class="card shadow-sm">
      <div class="card-body p-4">
        <form method="post" novalidate>
          {% csrf_token %}
          {% if form.non_field_errors %}
            <div class="alert alert-danger small">Benutzername oder Passwort ist falsch.</div>
          {% endif %}
          <div class="mb-3">
            <label for="id_username" class="form-label">Kennung</label>
            <input type="text" name="username" id="id_username" class="form-control" autocomplete="username"
                   value="{{ form.username.value|default:'' }}" required autofocus>
          </div>
          <div class="mb-3">
            <label for="id_password" class="form-label">Passwort</label>
            <input type="password" name="password" id="id_password" class="form-control"
                   autocomplete="current-password" required>
          </div>
          <input type="hidden" name="next" value="{{ next }}">
          <button type="submit" class="btn btn-primary w-100">Anmelden</button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}

{% comment %}
  Genehmigen/Ablehnen einer Anfrage (oder Verlängerung, wenn extension=True). Erwartet: booking, next.
{% endcomment %}<form method="post" class="d-flex flex-wrap gap-1 mt-2">{% csrf_token %}
  <input type="hidden" name="next" value="{{ next }}">
  <input type="text" name="comment" class="form-control form-control-sm flex-grow-1" style="min-width:10rem" placeholder="Kommentar (optional)" aria-label="Kommentar">
  {% if extension %}
    <button class="btn btn-sm btn-success" formaction="{% url 'loans:approve_extension' booking.pk %}"><i class="bi bi-check-lg"></i> Verlängern</button>
    <button class="btn btn-sm btn-outline-danger" formaction="{% url 'loans:reject_extension' booking.pk %}">Ablehnen</button>
  {% else %}
    <button class="btn btn-sm btn-success" formaction="{% url 'loans:approve' booking.pk %}"><i class="bi bi-check-lg"></i> Genehmigen</button>
    <button class="btn btn-sm btn-outline-danger" formaction="{% url 'loans:reject' booking.pk %}">Ablehnen</button>
  {% endif %}
</form>
